name: Post-scan
description: Scan the packaged application for secrets and vulnerabilities

inputs:
  scan-path:
    description: Extracted package directory
    required: false
    default: extracted

runs:
  using: composite
  steps:
    - name: Scan package for secrets with Gitleaks
      uses: gitleaks/gitleaks-action@v2
      with:
        source: ${{ inputs.scan-path }}

    - name: Scan package for secrets with TruffleHog
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.scan-path }}
      run: |
        docker run --rm \
          -v "$GITHUB_WORKSPACE/$SCAN_PATH:/pwd" \
          trufflesecurity/trufflehog:latest \
          filesystem /pwd --results=verified,unknown

    - name: Scan package with Trivy
      uses: aquasecurity/trivy-action@v0.36.0
      with:
        scan-type: fs
        scan-ref: ${{ inputs.scan-path }}
        scanners: vuln,secret,misconfig
        severity: HIGH,CRITICAL
        exit-code: '1'